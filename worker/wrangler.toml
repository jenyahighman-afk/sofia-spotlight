name = "sofia-spotlight-coach"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated. Add ",http://localhost:8080" while testing locally, then take it out again.
ALLOWED_ORIGINS = "https://jenyahighman-afk.github.io"
# claude-opus-5-5 is the default; switch to claude-sonnet-5-5 to halve the cost per review.
MODEL = "claude-opus-5-5"
# Daily reminder (web push). The public key is public (the app holds the same one in js/push-config.js);
# the private key is a secret:  npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BK8jDFDP2qMkZvznTnakukwrI5qklQe7yL7rAbcbGIVuZVKJCXEHrIaUAzDXiDXqKL412OvNB5FVkummcDR6Fog"
VAPID_SUBJECT = "https://jenyahighman-afk.github.io/sofia-spotlight/"

# Send due reminders every 15 minutes (the app's time picker uses quarter hours).
[triggers]
crons = ["*/15 * * * *"]

# Rate limiting (20 reviews per family per day). Create once with:  npx wrangler kv namespace create RATE
# then paste the id it prints here. Without this binding the limit is still enforced, but per worker instance only.
[[kv_namespaces]]
binding = "RATE"
id = "8c6b0df54fe14e9d9ada3027db61f7a3"

# Reminder subscriptions. Create once with:  npx wrangler kv namespace create REMIND
# then paste the id it prints here and remove the leading "# " on the next three lines. Without it, reminders answer 503.
[[kv_namespaces]]
binding = "REMIND"
id = "719769abf1674abba8e4933bd3593b28"

# The API key is a secret, never a var:  npx wrangler secret put ANTHROPIC_API_KEY
